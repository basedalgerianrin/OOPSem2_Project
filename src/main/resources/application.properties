spring.application.name=Web_target

# Makes JSON responses display with proper indentation in the browser
spring.jackson.serialization.indent-output=true
server.port=8081

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:targetdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - auto create tables from our models
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Makes sure JPA creates the tables FIRST, then data.sql runs second
spring.jpa.defer-datasource-initialization=true

# H2 console - lets us see the database in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
